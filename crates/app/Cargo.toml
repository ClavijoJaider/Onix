[package]
name = "mi-terminal"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mi-terminal"
path = "src/main.rs"

[dependencies]
term-core = { path = "../term-core" }
winit = "=0.30.13"
wgpu = { version = "=30.0.2", default-features = false, features = ["metal", "wgsl"] }
glyphon = "=0.12.0"
pollster = "=0.4.0"
serde_json = "1"
